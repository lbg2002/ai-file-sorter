name: Remote API · Ubuntu DEB & Release

on:
  push:
    branches:
      - feature/remote-api-apple-ui-release-20261010
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remote-api-deb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-remote-deb:
    name: Build Ubuntu 24.04 remote-only DEB
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout source (no llama.cpp required)
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Qt and application development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake make ninja-build pkg-config python3 patchelf binutils \
            qt6-base-dev qt6-base-dev-tools qt6-l10n-tools qt6-tools-dev-tools \
            libcurl4-gnutls-dev libjsoncpp-dev libsqlite3-dev libssl-dev \
            libfmt-dev libspdlog-dev libmediainfo-dev libzen-dev zlib1g-dev \
            libx11-dev

      - name: Compile remote-only application
        run: |
          make -C app -j2 REMOTE_API_ONLY=1
          test -x app/bin/aifilesorter-bin

      - name: Check runtime link dependencies
        run: |
          if readelf -d app/bin/aifilesorter-bin | grep -E 'NEEDED.*lib(llama|ggml|mtmd)'; then
            echo "::error::Remote build unexpectedly needs a local inference library"
            exit 1
          fi
          ldd app/bin/aifilesorter-bin
          if ldd app/bin/aifilesorter-bin | grep 'not found'; then
            exit 1
          fi

      - name: Build installable DEB
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.9.2+guard.75"
          fi
          bash app/scripts/package_deb.sh --remote-api-only "$VERSION"
          dpkg-deb --info dist/aifilesorter_deb/*.deb
          mkdir -p dist/release
          cp dist/aifilesorter_deb/*.deb dist/release/

      - name: Upload downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: filesort-guard-remote-ubuntu24-amd64
          path: dist/release/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/release/*.deb \
            --title "FileSort Guard $GITHUB_REF_NAME · Remote API" \
            --generate-notes
