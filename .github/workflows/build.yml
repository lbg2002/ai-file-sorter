name: FileSort Lite CI
on:
  push:
    branches: [ main, lite-rewrite ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test safety core
        run: python -m unittest discover -s tests -v
      - name: Build single executable
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name FileSortLite run.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileSortLite-${{ runner.os }}
          path: dist/FileSortLite*
          if-no-files-found: error
