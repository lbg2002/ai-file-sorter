name: FileSort Lite · Rust Desktop

on:
  push:
    branches: [rust-ui-rebuild, original-ui-parity]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-lite-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: FileSortLite-Linux
          - os: windows-2022
            bundles: nsis
            artifact: FileSortLite-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2'
      - name: Generate desktop icons
        working-directory: src-tauri
        run: cargo tauri icon icons/source.svg
      - name: Test safety core
        working-directory: src-tauri
        run: cargo test
      - name: Build desktop bundle
        working-directory: src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}
      - name: Upload Linux installers
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
